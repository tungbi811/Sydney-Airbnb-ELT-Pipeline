version: 2

# Every entity feeds a snapshot, so its key must be unique and its timestamp present.
models:
  - name: int_host
    columns:
      - name: host_id
        tests: [not_null, unique]
      - name: scraped_date
        tests: [not_null]

  - name: int_property
    columns:
      - name: listing_id
        tests: [not_null, unique]
      - name: scraped_date
        tests: [not_null]

  - name: int_lga
    columns:
      - name: lga_code
        tests: [not_null, unique]
      - name: scraped_date
        tests: [not_null]

  - name: int_suburb
    columns:
      - name: suburb_name
        tests: [not_null, unique]
      - name: scraped_date
        tests: [not_null]
